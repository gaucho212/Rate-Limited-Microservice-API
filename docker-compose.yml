services:
  # 1. Baza danych PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: production_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Pamięć podręczna / Cache (Redis)
  redis:
    image: redis:7-alpine
    container_name: production_redis
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Aplikacja Backendowa (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: production_backend
    restart: always
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # 4. Reverse Proxy (Nginx)
  nginx:
    image: nginx:1.25-alpine
    container_name: production_nginx
    restart: always
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app_network

# Trwałe przechowywanie danych (Data Persistence)
volumes:
  postgres_data:

# Izolowana sieć wewnętrzna
networks:
  app_network:
    driver: bridge